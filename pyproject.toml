[project]
name = "forager-faculty"
version = "0.1.0"
description = "Forager Faculty — LLM-driven adaptive crawler for university faculty data: evaluate/fix/re-evaluate loop, 4-stage pipeline (school info → departments → teacher roster → teacher details), anti-WAF request stack"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.49.0",
    "beautifulsoup4>=4.12.0",
    "cloakbrowser>=0.5.7",
    "curl-cffi>=0.16.0",
    "drissionpage>=4.1.1.4",
    "lxml>=5.1.0",
    "openai>=2.0.0",
    "pdfplumber>=0.11.10",
    "playwright>=1.48.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "regex>=2026.1.15",
]
